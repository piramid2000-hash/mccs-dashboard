# 안드로이드 앱(구글 플레이용 .aab + 설치 시험용 .apk) 빌드
# GitHub 빌드 서버에는 안드로이드 SDK 가 설치·라이선스 동의된 상태로 준비되어 있다.
#
# 서명 (구글 플레이 업로드용) — 저장소 Secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# 없으면 디버그 서명 APK 만 만든다 (설치 시험용).
#
# 실행: Actions 탭 → '안드로이드 앱 빌드' → Run workflow → 끝나면 실행 화면 아래 Artifacts 에서 내려받기
name: 안드로이드 앱 빌드

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "표시 버전 (예: 1.0.0). 내부 버전 번호는 실행 번호로 자동 증가"
        default: "1.0.0"
  push:
    branches: [main]
    paths: ["android/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 안드로이드 SDK 36 준비
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: 업로드 키 준비
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: 빌드 (서명된 .aab + .apk)
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android --no-daemon bundleRelease assembleRelease

      - name: 빌드 (키 없음 → 시험용 디버그 .apk)
        if: env.HAS_KEY != 'true'
        run: gradle -p android --no-daemon assembleDebug

      - name: 서명 지문 확인 (assetlinks.json 에 넣는 값)
        run: |
          for f in $(find android/app/build/outputs/apk -name "*.apk"); do
            echo "$f"; keytool -printcert -jarfile "$f" | grep -E "SHA256:" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wonieng-android-${{ env.VERSION_NAME }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
