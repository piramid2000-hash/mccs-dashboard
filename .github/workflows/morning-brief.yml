# 매일 아침 대표 브리핑 메일
# 경리부가 전날 퇴근 때 구글 드라이브 폴더에 올린 엑셀을 읽어,
# 어제 대비 변화(수금·외주 결제·일정 지연)를 정리해 메일로 보낸다. 카톡 공유용 HTML 첨부.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   GDRIVE_FOLDER_ID, GDRIVE_SERVICE_ACCOUNT, SMTP_USER, SMTP_PASSWORD, BRIEF_TO
# 선택: DASHBOARD_URL
name: 아침 브리핑

on:
  schedule:
    # 월~금 한국시간 07:17 (UTC 전날 22:17). 정각을 피해 지연을 줄임
    - cron: "17 22 * * 0-4"
  workflow_dispatch: {}   # Actions 탭에서 '지금 보내기' 수동 실행

permissions:
  contents: read

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install pandas openpyxl google-api-python-client google-auth

      # 어제 버전 요약(일정·금액)을 이어받아 '어제 대비 변화'를 계산
      - name: 어제 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: exec_dashboard/.history
          key: brief-history-${{ github.run_id }}
          restore-keys: brief-history-

      - name: 브리핑 만들고 메일 보내기
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        # 공개 저장소라 로그에는 건수만 찍힌다 (금액·공사명 없음)
        run: python exec_dashboard/scripts/morning_brief.py -o "$RUNNER_TEMP/brief.html"

      - name: 오늘 기록 저장
        if: success()
        uses: actions/cache/save@v4
        with:
          path: exec_dashboard/.history
          key: brief-history-${{ github.run_id }}
